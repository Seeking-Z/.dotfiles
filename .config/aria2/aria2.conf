# ==========================================
# aria2 configuration
# ==========================================


# ---------- Download ----------

# 下载目录
dir=${HOME}/downloads

# 支持断点续传
continue=true

# 同时下载的任务数量
max-concurrent-downloads=3

# 单个服务器的最大连接数
max-connection-per-server=16

# 单个文件最大分段数
split=16

# 文件至少达到这个大小才进行分段
min-split-size=5M

# 下载失败后的重试等待时间
retry-wait=5

# 最大重试次数
max-tries=5

# 文件已存在时自动重命名
auto-file-renaming=true

# 使用服务器提供的文件修改时间
remote-time=true


# ---------- RPC ----------

# 启用 JSON-RPC / XML-RPC
enable-rpc=true

# 只允许本机访问 RPC
rpc-listen-all=false

# RPC 端口
rpc-listen-port=6800


# ---------- Session ----------

# 保存未完成任务
save-session=${HOME}/.config/aria2-session

# 启动时恢复之前保存的任务
input-file=${HOME}/.config/aria2-session

# 每 60 秒保存一次 session
save-session-interval=60


# ---------- File ----------

# 使用 UTF-8 文件名
content-disposition-default-utf8=true
