# Automatically install TPM and plugins if TPM is missing
if "test ! -d ~/.tmux/plugins/tpm" \
    "run 'git clone https://github.com/tmux-plugins/tpm ~/.tmux/plugins/tpm && ~/.tmux/plugins/tpm/bin/install_plugins'"

# Plugins
# vim-tmux-navigator
set -g @plugin 'christoomey/vim-tmux-navigator'
# Powerline status bar
set -g @plugin 'erikw/tmux-powerline'

# conf of vim-tmux-navigator
set -g @vim_navigator_mapping_prev ""
set -g @vim_navigator_prefix_mapping_clear_screen ""

# =====================
# Prefix key
# =====================

# Change prefix from C-b to C-a
unbind C-b
set -g prefix C-a
bind C-a send-prefix


# =====================
# General
# =====================

# Enable mouse
set -g mouse on

# History size
set -g history-limit 100000

# Start window index at 1
set -g base-index 1

# Start pane index at 1
set -g pane-base-index 1

# Renumber windows after closing
set -g renumber-windows on

# Faster escape time (important for Vim)
set -sg escape-time 10

# Disable automatic window renaming
set-option -g allow-rename off

# True color support
set -g default-terminal "tmux-256color"
set -as terminal-features ",xterm-kitty:RGB"

# Navigation in Vi mode
set -g mode-keys vi

# Navigation in Vi copy mode
bind-key -T copy-mode-vi 'C-h' select-pane -L
bind-key -T copy-mode-vi 'C-j' select-pane -D
bind-key -T copy-mode-vi 'C-k' select-pane -U
bind-key -T copy-mode-vi 'C-l' select-pane -R


# =====================
# Pane resizing
# =====================

# Ctrl+a, then h/j/k/l: resize pane by 5 cells
bind -r h resize-pane -L 5
bind -r j resize-pane -D 5
bind -r k resize-pane -U 5
bind -r l resize-pane -R 5


# =====================
# Swap panes
# =====================

bind H swap-pane -U
bind J swap-pane -D
bind K swap-pane -U
bind L swap-pane -D


# =====================
# Split panes
# =====================

# Split left/right
bind | split-window -h -c "#{pane_current_path}"

# Split top/bottom
bind - split-window -v -c "#{pane_current_path}"

# Initialize TPM (keep at the bottom)
run '~/.tmux/plugins/tpm/tpm'
